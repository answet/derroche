[package]
name = "derroche"
version = "0.1.1"
edition = "2024"

[dependencies]
iced = { version = "0.14.0", features = ["svg"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
chrono = "0.4"
directories = "6"
image = "0.25"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde_json = "1"

[build-dependencies]
winresource = "0.1"
